name: Deploy Web to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'src/Dima.Web/**'
      - 'src/Dima.Core/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject StripePublicKey into appsettings.json
        run: |
          jq --arg key "${{ secrets.STRIPE_PUBLIC_KEY }}" \
             '.StripePublicKey = $key' \
             src/Dima.Web/wwwroot/appsettings.json > /tmp/appsettings.json
          mv /tmp/appsettings.json src/Dima.Web/wwwroot/appsettings.json
          echo "appsettings.json após injeção:"
          cat src/Dima.Web/wwwroot/appsettings.json | jq '. + { StripePublicKey: "REDACTED" }'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'src/Dima.Web'
          api_location: ''
          output_location: 'wwwroot'
